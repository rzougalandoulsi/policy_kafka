# Workflow A: validates every pull request that touches policies, contracts, fixtures or tooling.
# Required status check on main (branch protection: "validate / policies"), CODEOWNERS review per bundle.
# Conventions: actions pinned by commit SHA, OPA pinned by OPA_VERSION + opa.sha256, least-privilege permissions,
# no secrets needed. Every step calls a script under scripts/ so the same checks run locally (scripts/validate.sh).
name: validate

on:
  pull_request:
    paths:
      - "bundles/**"
      - "contracts/**"
      - "tests/**"
      - "scripts/**"
      - "OPA_VERSION"
      - "opa.sha256"
      - "REGAL_VERSION"
      - ".regal/**"
      - ".gitleaks.toml"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "85"
  PYTHON_PINS: "jsonschema==4.26.0 rfc3339-validator==0.1.4"

jobs:
  policies:
    name: policies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (full history for the changed-bundle diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned OPA (checksum from opa.sha256)
        run: |
          scripts/install-opa.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install JSON Schema validator
        run: python3 -m pip install --user --disable-pip-version-check $PYTHON_PINS

      - name: Changed bundles (informational; the whole suite always runs because core composes every bundle)
        run: |
          {
            echo "### Changed bundles"
            scripts/changed-bundles.sh --since "origin/${{ github.base_ref || 'main' }}" | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: opa fmt --diff
        run: opa fmt --diff --fail bundles tests

      - name: opa check --strict
        run: opa check --strict bundles tests --ignore fixtures --ignore integration

      - name: opa test
        run: opa test bundles tests --ignore fixtures --ignore integration -v

      - name: opa test --coverage (threshold ${{ env.COVERAGE_THRESHOLD }}%)
        run: |
          mkdir -p dist
          opa test bundles tests --ignore fixtures --ignore integration --coverage --threshold "$COVERAGE_THRESHOLD" --format=json > dist/coverage.json
          python3 -c 'import json; print("coverage %.1f%%" % json.load(open("dist/coverage.json"))["coverage"])' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bundle roots, pairwise prefixes, packages under root, cross-bundle imports
        run: scripts/check-roots.sh

      - name: Per-bundle lib copies identical
        run: scripts/check-lib-sync.sh

      - name: No http.send / opa.runtime
        run: scripts/check-builtins.sh

      - name: Contract copies in sync (no-op after the extraction)
        run: scripts/check-contract-sync.sh

      - name: Fixtures evaluate to the expected decisions
        run: scripts/eval-fixtures.sh --out dist/fixture-outputs

      - name: Fixture inputs, decision outputs and catalogue match the JSON schemas
        run: scripts/check-schemas.sh --outputs dist/fixture-outputs

      - name: Rules and bundle inventory page is up to date (scripts/inventory.sh; no-op after the extraction)
        run: scripts/inventory.sh --check

      - name: Set up Regal
        uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          version: v0.43.0

      - name: Regal lint
        run: regal lint --format github bundles tests

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # [A] required only for organisation accounts (https://gitleaks.io); leave unset for personal repositories.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: opa build dry run per bundle (catches root violations at build time)
        run: |
          mkdir -p dist/dry-run
          for b in core manifests naming quotas resources changes; do
            opa build -b "bundles/$b" --ignore '*_test.rego' -o "dist/dry-run/$b.tar.gz"
            echo "$b builds"
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validate-reports
          path: |
            dist/coverage.json
            dist/fixture-outputs/
            dist/catalog.json
          retention-days: 7
