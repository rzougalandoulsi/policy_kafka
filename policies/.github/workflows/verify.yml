# Workflow D: verifies an environment after a deploy (called by the application repository's deploy.yml through
# `gh workflow run`), on demand, and nightly. From the runner: every artifact of the release exists in Artifactory
# with the recorded checksum and loads under signature verification. Against the namespace: every governance pod
# reports the release (readiness component policyRelease), its OPA sidecar has all bundles active, and the fixtures
# evaluated on each sidecar's loopback Data API (through `oc exec`) equal the expected decisions. A pass records
# releases/<env>/verified/<releaseId>.json, which Workflow E requires of a rollback target.
#
# [A] inputs: repository variables ARTIFACTORY_URL, ARTIFACTORY_OPA_BUNDLES_REPOSITORY, JFROG_PLATFORM_URL,
#   JFROG_OIDC_PROVIDER_NAME, JFROG_OIDC_AUDIENCE, OPA_BUNDLE_SIGNING_PUBLIC_KEY (+ OPA_BUNDLE_SIGNING_KEY_ID, and the
#   _PREVIOUS pair during a key rotation); environment "verify-<env>" variables
#   OPENSHIFT_SERVER, OPENSHIFT_NAMESPACE and secrets OPENSHIFT_TOKEN (read + exec on the governance pods),
#   ARTIFACTORY_VERIFY_TOKEN (fallback, read + deploy on releases/**), SLACK_WEBHOOK_URL (optional).
name: verify

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to verify"
        required: true
        type: choice
        options: [dev, staging, production]
      releaseId:
        description: "Expected release id (empty: the one the pods report)"
        required: false
  schedule:
    - cron: "17 3 * * *"   # nightly, every environment

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'schedule' && fromJSON('["dev","staging","production"]') || fromJSON(format('["{0}"]', github.event.inputs.environment)) }}
    environment: verify-${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
      ARTIFACTORY_REPOSITORY: ${{ vars.ARTIFACTORY_OPA_BUNDLES_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned OPA
        run: |
          scripts/install-opa.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Authenticate to Artifactory (JFrog OIDC)
        id: jfrog
        if: vars.JFROG_OIDC_PROVIDER_NAME != ''
        uses: jfrog/setup-jfrog-cli@6ed45ef1a24199bd4c94d3fd55a7e8cb7e45985d # v5.3.2
        env:
          JF_URL: ${{ vars.JFROG_PLATFORM_URL }}
        with:
          oidc-provider-name: ${{ vars.JFROG_OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ vars.JFROG_OIDC_AUDIENCE }}
      - name: Select the access token
        env:
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
          FALLBACK_TOKEN: ${{ secrets.ARTIFACTORY_VERIFY_TOKEN }}
        run: |
          if [ -n "$OIDC_TOKEN" ]; then echo "::add-mask::$OIDC_TOKEN"; echo "ARTIFACTORY_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"
          elif [ -n "$FALLBACK_TOKEN" ]; then echo "ARTIFACTORY_TOKEN=$FALLBACK_TOKEN" >> "$GITHUB_ENV"
          else echo "::error::no Artifactory credentials"; exit 1; fi
      - name: Verification keys (current key and, during a rotation, the previous one)
        env:
          KEY_ID: ${{ vars.OPA_BUNDLE_SIGNING_KEY_ID || 'governance-policies' }}
          KEY_PEM: ${{ vars.OPA_BUNDLE_SIGNING_PUBLIC_KEY }}
          PREVIOUS_KEY_ID: ${{ vars.OPA_BUNDLE_SIGNING_KEY_ID_PREVIOUS }}
          PREVIOUS_KEY_PEM: ${{ vars.OPA_BUNDLE_SIGNING_PUBLIC_KEY_PREVIOUS }}
        run: |
          test -n "$KEY_PEM" || { echo "::error::repository variable OPA_BUNDLE_SIGNING_PUBLIC_KEY is not set"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY_PEM" > "$RUNNER_TEMP/keys/$KEY_ID.pem"
          if [ -n "$PREVIOUS_KEY_PEM" ]; then
            test -n "$PREVIOUS_KEY_ID" || { echo "::error::OPA_BUNDLE_SIGNING_KEY_ID_PREVIOUS must name the previous key"; exit 1; }
            printf '%s\n' "$PREVIOUS_KEY_PEM" > "$RUNNER_TEMP/keys/$PREVIOUS_KEY_ID.pem"
          fi
          for k in "$RUNNER_TEMP"/keys/*.pem; do echo "trusted key id: $(basename "$k" .pem)"; done
      - name: Log in to OpenShift [A]
        uses: redhat-actions/oc-login@2a1614bc977c054c8786c8e35fc9534bd0ddc156 # v2.0.1
        with:
          openshift_server_url: ${{ vars.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ vars.OPENSHIFT_NAMESPACE }}
      - name: Pods report the release, sidecars active, fixtures agree
        id: active
        run: |
          scripts/verify-active.sh --namespace "${{ vars.OPENSHIFT_NAMESPACE }}" --deployment governance \
            ${{ github.event.inputs.releaseId && format('--release-id {0}', github.event.inputs.releaseId) || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Artifacts of that release exist unchanged and load under signature verification
        run: |
          rid="${{ steps.active.outputs.release-id }}"
          mkdir -p dist/verify
          curl -sSf -H "Authorization: Bearer $ARTIFACTORY_TOKEN" -o "dist/verify/$rid.json" "$ARTIFACTORY_URL/$ARTIFACTORY_REPOSITORY/releases/${{ matrix.environment }}/$rid.json"
          scripts/verify-artifacts.sh --manifest "dist/verify/$rid.json" --verification-keys "$RUNNER_TEMP/keys" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Mark the promotion verified
        run: scripts/mark-verified.sh --release-id "${{ steps.active.outputs.release-id }}" --environment "${{ matrix.environment }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Notify
        if: always() && vars.SLACK_WEBHOOK_URL != ''
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          text="policy release verification ${{ matrix.environment }}: ${{ job.status }} (${{ steps.active.outputs.release-id || github.event.inputs.releaseId }}) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST -H 'Content-Type: application/json' --data "$(python3 -c 'import json,sys; print(json.dumps({"text": sys.argv[1]}))' "$text")" "$WEBHOOK" >/dev/null || true
