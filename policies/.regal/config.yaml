# Regal (REGAL_VERSION) configuration for governance-policies. Rego v1 only.
#
# Phase 3 introduced the linter with a baseline that switched off every rule the pre-existing Rego tripped, so that
# the extraction changed no policy behaviour. Phase 8 burned that baseline down: the behaviour-neutral findings
# (pointless reassignment, comprehension term assignment, messy incremental rule, repeated computation, non-loop
# expressions, set/object comprehensions that are now partial rules, the unconditional assignment in core) were fixed
# in the sources, and the 8 fixtures' expected decisions stayed byte-identical. What remains below is structural, with
# the reason next to each entry. Never add an entry without a reason; prefer fixing the Rego.
project:
  rego-version: 1
  roots:
    - path: bundles
    - path: tests
rules:
  idiomatic:
    # bundles/<name>/*.rego declare governance.<name>[.*]; the bundle root (governance/<name>) is the namespace, not
    # the directory tree, and scripts/check-roots.sh enforces that mapping.
    directory-package-mismatch:
      level: ignore
    # Entrypoints are passed to `opa build -O1 -e ...` by scripts/build-release.sh per bundle, not annotated in Rego.
    no-defined-entrypoint:
      level: ignore
    # limits.rego: `retention_exceeds(r) if r == -1` reads as the business rule ("infinite retention is never
    # allowed"); a literal in the function head would hide it.
    equals-pattern-matching:
      level: ignore
  imports:
    # `data.system.bundles` is provided by the OPA runtime (bundle plugin), not by any file Regal can see.
    unresolved-reference:
      except-paths:
        - data.system.bundles
    # Test packages import the package under test for readability (`core.decision` rather than
    # `data.governance.core.decision`), which Regal reads as importing their own parent package.
    pointless-import:
      ignore:
        files:
          - "tests/*_test.rego"
  style:
    line-length:
      level: ignore
    file-length:
      level: ignore
    # `approvals` in package governance.changes.approval is the bundle contract name that core reads dynamically
    # (data.governance[ns].approvals); the package name describes the concern. Neither can be renamed without
    # changing the contract, so the finding is accepted for this one file.
    rule-name-repeats-package:
      ignore:
        files:
          - "bundles/changes/approval.rego"
    # Shared fixture helpers reference the package-level `zero` defaults on purpose.
    external-reference:
      ignore:
        files:
          - "tests/*_test.rego"
