apiVersion: v1
kind: Service
metadata:
  name: {{ include "governance.fullname" . }}
  labels:
    {{- include "governance.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "governance.selectorLabels" . | nindent 4 }}
