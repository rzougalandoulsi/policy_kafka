{{- if .Values.externalSecrets.enabled }}
{{- $root := . }}
{{- range $secret := list "db" "kafka" "artifactory" }}
---
# External Secrets Operator syncs the Secret this chart reads; the remote keys are environment inputs [A].
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ if eq $secret "artifactory" }}{{ $root.Values.artifactory.tokenSecret.name }}{{ else }}{{ (index $root.Values.secrets $secret).name }}{{ end }}
  labels:
    {{- include "governance.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    {{- toYaml $root.Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ if eq $secret "artifactory" }}{{ $root.Values.artifactory.tokenSecret.name }}{{ else }}{{ (index $root.Values.secrets $secret).name }}{{ end }}
    creationPolicy: Owner
  data:
  {{- if eq $secret "artifactory" }}
    - secretKey: {{ $root.Values.artifactory.tokenSecret.key }}
      remoteRef:
        key: {{ $root.Values.externalSecrets.remoteRefs.artifactory.token | quote }}
  {{- else }}
    {{- range $logical, $secretKey := (index $root.Values.secrets $secret).keys }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ index (index $root.Values.externalSecrets.remoteRefs $secret) $logical | quote }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
