// Static JAAS file required by the cp-kafka image when SASL is enabled. The effective per-listener credentials
// come from KAFKA_LISTENER_NAME_*_PLAIN_SASL_JAAS_CONFIG in docker-compose.yml (listener config takes precedence).
KafkaServer {
  org.apache.kafka.common.security.plain.PlainLoginModule required
  username="admin"
  password="admin-secret"
  user_admin="admin-secret";
};
