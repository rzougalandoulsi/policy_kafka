spring:
  application:
    name: governance
  datasource:
    url: ${GOVERNANCE_DB_URL:jdbc:postgresql://localhost:5432/governance}
    username: ${GOVERNANCE_DB_USER:governance}
    password: ${GOVERNANCE_DB_PASSWORD:governance}
    hikari:
      maximum-pool-size: ${GOVERNANCE_DB_POOL:16}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8089/default}

server:
  port: ${GOVERNANCE_PORT:8080}

# Policy bundles are uploaded base64-encoded inside a JSON body; allow a few MB.
spring.codec.max-in-memory-size: ${GOVERNANCE_MAX_BODY:8MB}

governance:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
    requests-topic: requests.manifest
    response-topic: response.manifest
    consumer-group: ${GOVERNANCE_CONSUMER_GROUP:governance}
    security-protocol: ${KAFKA_SECURITY_PROTOCOL:}
    sasl-mechanism: ${KAFKA_SASL_MECHANISM:}
    sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}
    schema-registry-auth: ${SCHEMA_REGISTRY_AUTH:}
    # Confirmed state the Orchestrator publishes (read-only for Governance): source of projected team usage.
    repository-state-topic: teams.repo.manifest
    usage-consumer-group: ${GOVERNANCE_USAGE_CONSUMER_GROUP:governance-usage}
    usage-consumer-enabled: ${GOVERNANCE_USAGE_CONSUMER_ENABLED:true}
  opa:
    url: ${OPA_URL:http://localhost:8181}
    decision-path: /v1/data/governance/core/decision
    catalog-path: /v1/data/governance/core/policy_catalog
    ready-path: /v1/data/governance/core/ready
    # One revision per bundle forms the policy release; every decision verifies all of them (fail closed).
    bundles: core,manifests,naming,quotas,resources,changes
    connect-timeout: 2s
    response-timeout: 5s
    max-retries: 2
    retry-backoff: 200ms
    verify-revision: true
    bundle-token: ${OPA_BUNDLE_TOKEN:}
    revision-check-interval: 15s
    # Input contract OpaInputAssembler produces, and the core contract majors this build accepts in decisions.
    contract-version: "2.0"
    supported-contract-majors: 1,2
    # local: ACTIVE bundle versions in the database, served to OPA by Governance (developer stacks, e2e test).
    # release: the mounted release manifest pins the set; OPA pulls from Artifactory (the openshift profile forces it).
    mode: ${GOVERNANCE_POLICY_MODE:local}
    release-file: ${GOVERNANCE_POLICY_RELEASE_FILE:}
  security:
    issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8089/default}
    teams-claim: ${OAUTH2_TEAMS_CLAIM:teams}
    environments-claim: ${OAUTH2_ENVIRONMENTS_CLAIM:environments}
    roles-claim: ${OAUTH2_ROLES_CLAIM:roles}
    admin-role: governance-admin
    approver-role: governance-approver
    auditor-role: governance-auditor
  workflow:
    authorization-validity: PT15M
    default-approval-ttl: PT72H
    max-evaluation-attempts: 3
    evaluation-retry-backoff: 30s
    # flowable: new approvals run on the embedded BPMN engine (ADR 0011). shadow: legacy stays authoritative and every
    # approval is mirrored into a process whose outcome is compared and recorded. legacy: no process instances.
    # Approvals already open keep the implementation they were opened with (governance_approvals_legacy_pending).
    engine: ${GOVERNANCE_WORKFLOW_ENGINE:flowable}
  outbox:
    poll-interval: 500ms
    batch-size: 100
    max-attempts: 10
    retry-backoff: 2s
  inbox:
    poll-records: 200
    retry-poll-interval: 5s
  usage:
    # Stage 2 waits (ERROR + inbox retry) until the confirmed state the plan was computed against has been consumed.
    require-fresh-snapshot: ${GOVERNANCE_USAGE_REQUIRE_FRESH_SNAPSHOT:true}
    reservation-sweep-interval: 30s

# Embedded Flowable process engine (ADR 0011): only the BPMN engine, on the Governance datasource and transaction
# manager. It creates and upgrades its own ACT_* tables at startup (Flyway never touches them). Definitions under
# classpath:/processes are deployed at startup; a new version is created only when the XML changed and running
# instances stay on the version they started with.
flowable:
  deployment-name: governance-approvals
  database-schema-update: true
  history-level: audit
  enable-history-cleaning: true
  history-cleaning-after: 365d
  idm:
    enabled: false                 # approvers come from the JWT and TeamAuthorization, never from engine identity tables
  eventregistry:
    enabled: false
  auto-deployment:
    use-lock: true                 # pods starting together create one deployment, not one each
  process:
    async:
      executor:
        default-timer-job-acquire-wait-time: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: db,opa,policyRelease,workflowEngine,readinessState

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    org.apache.kafka: WARN
    io.confluent: WARN
    # A rolled-back approval (OPA unavailable, plan swapped) is answered as 409 and logged by the caller; the engine's
    # own stack trace for the same exception adds nothing.
    org.flowable.common.engine.impl.interceptor.CommandContext: OFF
